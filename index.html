<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>教师招考刷题</title>
<style>
  :root{
    --primary:#4f46e5; --primary-d:#4338ca; --bg:#eef1f6; --card:#ffffff;
    --ok:#16a34a; --ok-bg:#e7f7ec; --bad:#dc2626; --bad-bg:#fdeaea;
    --sel:#eef2ff; --sel-b:#6366f1; --txt:#1f2430; --sub:#6b7280; --line:#eceef3;
    --radius:16px; --sh:0 6px 20px rgba(31,36,48,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--txt);line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:580px;margin:0 auto;min-height:100vh;background:var(--bg);
       padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
  .pad{padding:14px 16px;}
  /* hero */
  .hero{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;
        padding:30px 20px 26px;border-radius:0 0 26px 26px;box-shadow:var(--sh);}
  .hero h1{margin:0;font-size:24px;font-weight:800;letter-spacing:1px;}
  .hero p{margin:8px 0 0;font-size:13px;opacity:.9;}
  /* subject cards */
  .subjects{padding:16px 14px 4px;display:flex;flex-direction:column;gap:12px;}
  .subj-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--sh);}
  .subj-head{display:flex;align-items:center;justify-content:space-between;}
  .subj-name{font-size:17px;font-weight:700;}
  .badge{background:var(--bad-bg);color:var(--bad);font-size:12px;font-weight:700;
         padding:2px 9px;border-radius:20px;}
  .subj-meta{color:var(--sub);font-size:13px;margin:4px 0 12px;}
  .subj-actions{display:flex;gap:10px;}
  .subj-actions .btn{flex:1;}
  /* wrong card */
  .wrong-card{background:var(--card);border-radius:var(--radius);padding:16px;margin:14px;
              box-shadow:var(--sh);}
  .wrong-head{font-size:15px;font-weight:700;margin-bottom:12px;}
  .foot{text-align:center;color:var(--sub);font-size:12px;padding:18px 16px 30px;}
  /* buttons */
  .btn{appearance:none;border:none;font-family:inherit;font-size:15px;font-weight:600;
       padding:13px 16px;border-radius:12px;cursor:pointer;transition:.15s;width:100%;}
  .btn.primary{background:var(--primary);color:#fff;}
  .btn.primary:active{background:var(--primary-d);transform:scale(.99);}
  .btn.ghost{background:var(--sel);color:var(--primary-d);}
  .btn.ghost:active{transform:scale(.99);}
  .btn.full{width:100%;}
  .btn.sm{padding:8px 12px;font-size:13px;border-radius:9px;}
  .btn.danger{background:#fff0f0;color:var(--bad);}
  .actions{display:flex;gap:10px;padding:14px 16px 4px;}
  .actions.col{flex-direction:column;}
  /* topbar */
  .topbar{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card);
          position:sticky;top:0;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.04);}
  .back{background:none;border:none;color:var(--primary-d);font-size:15px;font-weight:600;
        cursor:pointer;padding:4px 2px;}
  .prog{font-size:14px;color:var(--sub);font-weight:600;flex:1;text-align:center;}
  .typetag{font-size:12px;font-weight:700;color:#fff;background:var(--primary);
           padding:3px 10px;border-radius:20px;}
  .ttl{font-size:16px;font-weight:700;flex:1;text-align:center;}
  /* progress bar */
  .pbar{height:5px;background:var(--line);}
  .pbar-fill{height:100%;background:linear-gradient(90deg,#6366f1,#8b5cf6);transition:width .25s;}
  /* quiz */
  .stem{font-size:18px;font-weight:600;padding:20px 18px 8px;line-height:1.7;}
  .options{padding:6px 14px 4px;display:flex;flex-direction:column;gap:11px;}
  .opt{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);
       border-radius:13px;padding:14px 15px;font-size:16px;cursor:pointer;transition:.12s;
       box-shadow:0 2px 6px rgba(31,36,48,.04);}
  .opt:active{transform:scale(.99);}
  .opt-key{flex:0 0 30px;height:30px;width:30px;border-radius:50%;background:var(--sel);color:var(--primary-d);
           display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;}
  .opt-text{flex:1;}
  .opt-mark{font-weight:800;font-size:18px;width:22px;text-align:center;}
  .opt.selected{border-color:var(--sel-b);background:var(--sel);}
  .opt.right{border-color:var(--ok);background:var(--ok-bg);}
  .opt.right .opt-mark{color:var(--ok);}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg);}
  .opt.wrong .opt-mark{color:var(--bad);}
  .options.judge{gap:14px;}
  .opt.judge{justify-content:center;font-size:18px;font-weight:700;padding:20px;}
  .tip{margin:14px 16px 0;padding:12px 14px;border-radius:11px;font-weight:600;font-size:15px;}
  .tip.ok{background:var(--ok-bg);color:var(--ok);}
  .tip.bad{background:var(--bad-bg);color:var(--bad);}
  .scorebar{text-align:center;color:var(--sub);font-size:14px;padding:14px;}
  .scorebar .ok{color:var(--ok);} .scorebar .bad{color:var(--bad);}
  .resume-note{text-align:center;color:var(--primary-d);font-size:13px;padding:0 16px 8px;}
  /* result */
  .result{padding:34px 18px;}
  .result-card{background:var(--card);border-radius:20px;padding:26px 20px;box-shadow:var(--sh);text-align:center;}
  .result-title{font-size:20px;font-weight:800;margin-bottom:22px;}
  .result-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px;}
  .result-grid>div{background:var(--bg);border-radius:13px;padding:16px 8px;}
  .result-grid b{display:block;font-size:26px;font-weight:800;}
  .result-grid span{font-size:13px;color:var(--sub);}
  .result-grid .ok{color:var(--ok);} .result-grid .bad{color:var(--bad);}
  /* wrong view */
  .wrong-view{padding-bottom:24px;}
  .wsubj{background:var(--card);border-radius:var(--radius);margin:12px 14px;padding:16px;
         box-shadow:var(--sh);}
  .wsubj-head{display:flex;justify-content:space-between;align-items:center;
              font-size:16px;font-weight:700;}
  .wsubj-head .cnt{color:var(--sub);font-size:13px;font-weight:600;}
  .wactions{display:flex;gap:10px;margin:12px 0;}
  .wlist{list-style:none;margin:6px 0 0;padding:0;}
  .witem{border-top:1px solid var(--line);padding:12px 0;}
  .wstem{font-size:15px;font-weight:600;line-height:1.55;}
  .wans{font-size:13px;margin-top:6px;color:var(--txt);}
  .wans b{color:var(--ok);}
  .wmeta{font-size:12px;color:var(--sub);margin-top:3px;}
  .empty{color:var(--sub);font-size:13px;padding:10px 0;text-align:center;}
  .danger-wrap{padding:6px 14px 0;}
</style>
</head>
<body>
<div id="app"></div>

"]},{"id":"xlx_0760","type":"judge","stem":"程序性知识是在人的头脑中以“产生式”这种动态的形式进行表征的。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0761","type":"judge","stem":"产生式是一种“条件——行动”的规则，是针对某一或某些特定条件得到满足时发生的某一或某些行为的程序。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0762","type":"judge","stem":"符号的表征是符号与其代表的事物或观念在学习者认知结构中建立起相应的等值关系。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0763","type":"judge","stem":"概念内涵大、外延小，表明概念的成员享有大量的共同属性，但包括少量的成员。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0764","type":"judge","stem":"概念是对同一类事物的差异性特征的反映，是较为复杂的陈述性知识。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0765","type":"judge","stem":"概念的表征就是学习掌握概念代表的一类事物的共同关键特征。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0766","type":"judge","stem":"符号的学习实质上是学习若干概念之间的关系。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0767","type":"judge","stem":"命题的学习实质是学习由几个概念联合构成的复合意义。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0768","type":"judge","stem":"显性知识可以通过语言、书籍、文字、数据库等编码方式传播，也容易被人们学习。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0769","type":"judge","stem":"显性知识是能够被人类以一定符码系统加以完整表述的知识。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0770","type":"judge","stem":"隐性知识是指那种我们知道但难以言述的知识。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0771","type":"judge","stem":"隐性知识存在于个人头脑中的，一般很难通过语言、文字、图表或符号进行明确表述与逻辑说明。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0772","type":"judge","stem":"隐性知识是通过人们的身体的感官或者直觉、领悟获得的，因此不是经过逻辑推理获得。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确" "id":"xlx_0786","type":"judge","stem":"知识的掌握是指在学习者对所学习的知识的接受及占有。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0787","type":"judge","stem":"知识的掌握就是通过一系列心智活动在头脑中建立起相应的表征的过程。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0788","type":"judge","stem":"知识的直观形成的是对有关知识的感性认识。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0789","type":"judge","stem":"在实质上，知识的掌握是学习者通过新知识的获得及新旧知识的整合建立起相应的认知结构，形成心智能力的过程。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0790","type":"judge","stem":"技能是通过练习形成的能完成一定任务的动作和智力操作系统。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0791","type":"judge","stem":"技能作为趋于完善化、自动化的复杂系统，包含智力活动方式和肢体动作方式。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0792","type":"judge","stem":"按照我国学者冯忠良的智慧技能形成阶段理论，原型操作阶段的学习目的在于获得正确动觉经验及确保活动方式的稳定性。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0793","type":"judge","stem":"按照我国学者冯忠良的智慧技能形成阶段理论，原型操作阶段往往是心智活动在直觉水平上的概括。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0794","type":"judge","stem":"按照我国学者冯忠良的智慧技能形成阶段理论，原型操作阶段的学习目的主要是熟悉活动的对象，了解活动的结构。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0795","type":"judge","stem":"在智慧技能形成的过程中，动作的执行在言语水平上由出声的外部言语到不出声的外部言语、再到内部言语的顺序不能颠倒。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0796","type":"judge","stem":"按照我国学者冯忠良的智慧技能形成阶段理论，原型操作阶段的主要学习目的在于在头脑中建立起完备的动作映象。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0797","type":"judge","stem":"内部言语阶段是活动达到智力水平的最后阶段，也就是名副其实的智力活动的形成阶段。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0798","type":"judge","stem":"按照加里培林的智慧技能五阶段理论，出声的外部言语阶段的特点是活动离开了它的物质或物质化的主体。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0799","type":"judge","stem":"按照加里培林的智慧技能五阶段理论，在活动的定向阶段要向学生说明心智动作的目的、动作客体和动作方式。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0800","type":"judge","stem":"按照加里培林的智慧技能五阶段理论，智慧技能的物质化指的是关于实物的特性和关系的物质化。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0801","type":"judge","stem":"按照加里培林的智慧技能五阶段理论，出声的外部言语阶段的主要特点是以出声的外部言语形式来完成实在的活动。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0802","type":"judge","stem":"按照加里培林的智慧技能五阶段理论，在活动的定向阶段的教学不需要向学生呈现心智动作的模式。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0803","type":"judge","stem":"按照加里培林的智慧技能五阶段理论，智慧技能的物质化指的是关于实物的特性化和关系化。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0804","type":"judge","stem":"智慧技能是运用概念和规则对外办事的描述性知识，主要用来加工外在的信息。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0805","type":"judge","stem":"元认知的实质就是人对认识活动的自我意识和自我调节。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0806","type":"judge","stem":"认知策略是个体调控自己的认识活动以提高认知操作水平的能力。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0807","type":"judge","stem":"学习者对学习过程的监控和调节属于学习策略中的元认知策略。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0808","type":"judge","stem":"在问题解决中，使用简化策略存在一定的风险，因为有些被认为是无关紧要的信息有可能是至关重要的。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0809","type":"judge","stem":"问题解决中的算法是根据目标的指引，试图不断地将问题状态转换成与目标相近的状态，尝试那些只对成功趋向的目标状态有价值的算子。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0810","type":"judge","stem":"品德是性格中具有道德评价意义的部分，是性格的核心成分。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0811","type":"judge","stem":"观察学习指通过观察环境中他人的行为及其后果而发生的学习。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0812","type":"judge","stem":"社会认知理论认为，儿童是通过观察他们生活中重要人物的行为而学得社会行为的。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0813","type":"judge","stem":"观察学习的保持过程是指将所观察到的行为信息储存在长久记忆中，直至被观察对象的行为对观察者的行为发生影响的这段过程。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0814","type":"judge","stem":"在观察学习中，观察者通过观察获得的新行为是否在未来的情境中表现出来取决于观察者对行为结果的预期。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0815","type":"judge","stem":"在观察学习中，强化能加强观察者重复所学行为的动机，也是影响观察学习的主观因素。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0816","type":"judge","stem":"根据柯尔伯格的品德发展阶段论，处于服从与惩罚定向阶段的儿童常常认为如果一个人由于某个行为而受到了惩罚，这种惩罚会使这个行为被认为是道德上错误的。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0817","type":"judge","stem":"根据柯尔伯格的品德发展阶段论，处于利己主义定向的儿童行为目的是为满足自己的需要和兴趣，只关注自己是否得到更多的利益。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0818","type":"judge","stem":"根据柯尔伯格的品德发展阶段论，儿童的品德发展进入习俗水平时，其道德判断会将行为与社会崇尚的观点与期望相对照。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0819","type":"judge","stem":"根据柯尔伯格的品德发展阶段论，处于维护权威与社会秩序定向阶段的儿童认为凡是得到别人允许的行为就是好的，而遭到别人反对的就是不好的。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0820","type":"judge","stem":"根据柯尔伯格的品德发展阶段论，处于人际和谐与一致阶段的儿童道德判断是以本人的行为是否被别人允许为衡量标准。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0821","type":"judge","stem":"根据柯尔伯格的品德发展阶段论，后习俗水平的儿童成为从社会突出出来的单独的实体，认为应将个人的观点放在社会的观点之前。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0822","type":"judge","stem":"根据柯尔伯格的品德发展阶段论，处于社会契约定向阶段的个体认为自己对社会、社会上的其他成员负有道义上的责任。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0823","type":"judge","stem":"根据柯尔伯格的品德发展阶段论，处于社会契约定向阶段的个体把法律、道德准则看作是维护社会秩序的一种契约，并持较为灵活的态度。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0824","type":"judge","stem":"皮亚杰认为人类的学习大多发生于社会情境中，只有站在社会学习的角度才能真正理解人类社会行为的发展。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0825","type":"judge","stem":"美国心理学家柯尔伯格认为品德发展的过程主要是对正义的看法，并且这一发展将持续终生。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0826","type":"judge","stem":"根据柯尔伯格的品德发展阶段论，处于社会契约定向阶段的个体认为自己对社会而不是他人负有某种道义职责。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0827","type":"judge","stem":"根据柯尔伯格的品德发展阶段论，处于社会契约定向阶段的个体对法律、道德准则持较为灵活的态度。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0828","type":"judge","stem":"皮亚杰研究儿童道德发展和教育问题时采用的研究方法是两难故事法。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0829","type":"judge","stem":"根据皮亚杰的道德认知发展阶段论，表现出单方面地尊重权威特征的儿童处于前道德阶段。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0830","type":"judge","stem":"2-8岁儿童的品德发展处于以服从规则为主要特征的自律道德阶段。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0831","type":"judge","stem":"瑞士心理学家皮亚杰认为儿童的品德发展是人的自然天赋与相应的社会因素相互作用的结果。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0832","type":"judge","stem":"皮亚杰认为，儿童的品德发展是一个由主观责任感向客观责任感的逐步转化过程。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0833","type":"judge","stem":"根据皮亚杰儿童品德发展阶段理论，前道德阶段的儿童已经有了道德观念的发展。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0834","type":"judge","stem":"根据皮亚杰儿童品德发展阶段理论，前道德阶段的儿童行为多与生理本能的满足有关。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0835","type":"judge","stem":"根据皮亚杰儿童品德发展阶段理论，前道德阶段的儿童已经具有了规则意识。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0836","type":"judge","stem":"根据皮亚杰儿童品德发展阶段理论，处于自我中心阶段的儿童缺乏按规则、规范行为的自觉性，还不能充分理解准则的程序和意义。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0837","type":"judge","stem":"根据皮亚杰儿童品德发展阶段理论，处于自我中心阶段的儿童已能够客观对待亲子关系、同伴关系、价值判断等方面的问题。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0838","type":"judge","stem":"根据皮亚杰儿童品德发展阶段理论，处于自我中心阶段的儿童常常片面强调自身的意见和要求。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0839","type":"judge","stem":"根据皮亚杰儿童品德发展阶段理论，规则对处于自我中心阶段的儿童不具有约束力。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0840","type":"judge","stem":"根据皮亚杰儿童品德发展阶段理论，处于自我中心阶段的儿童还不能把自己同外在环境区别开来，而是把外在环境看作是他自身的延伸。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0841","type":"judge","stem":"根据皮亚杰儿童品德发展阶段理论，5-8岁的儿童认为服从权威和准则的人就是好的。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0842","type":"judge","stem":"根据皮亚杰儿童品德发展阶段理论，5-8岁的儿童往往表现为绝对地尊敬和顺从外在权威和准则。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0843","type":"judge","stem":"根据皮亚杰儿童品德发展阶段理论，2-5岁儿童的道德判断是以他律的、绝对的规则及对权威的绝对服从和崇拜为特征。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0844","type":"judge","stem":"根据皮亚杰儿童品德发展阶段理论，品德发展处于他律道德阶段的儿童常常将自然法则和道德法则相混淆。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0845","type":"judge","stem":"根据皮亚杰儿童品德发展阶段理论，品德发展处于他律道德阶段的儿童不是从行为的物质后果来判断是非，而是从动机来判断好坏。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0846","type":"judge","stem":"品德发展处于他律道德阶段的儿童认为遵守成人标准和服从成人规则是一种义务。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0847","type":"judge","stem":"根据皮亚杰儿童品德发展阶段理论，品德发展处于他律道德阶段的儿童已经能够设身处地地看问题和具体情况具体分析。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0848","type":"judge","stem":"根据皮亚杰儿童品德发展阶段理论，处于自律阶段的儿童已认识到，如果所有的人都同意，规则是可以改变的。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0849","type":"judge","stem":"根据皮亚杰儿童品德发展阶段理论，处于自律阶段的儿童还不能意识到准则是一种保证共同利益、契约性的、自愿接受的行为准则。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0850","type":"judge","stem":"根据皮亚杰儿童品德发展阶段理论，处于合作道德阶段的儿童的公正感不是以“平等”为特征，而是以“服从”的观念为主要特征。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0851","type":"judge","stem":"根据皮亚杰儿童品德发展阶段理论，处于合作道德阶段的儿童开始懂得判断行为好坏，不只看后果，还要看行为的动机。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0852","type":"judge","stem":"根据皮亚杰儿童品德发展阶段理论，处于合作道德阶段的儿童不仅能较高地评价自己的观点与能力，也能较客观地评判他人。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0853","type":"judge","stem":"根据皮亚杰儿童品德发展阶段理论，处于合作道德阶段的儿童能设身处地对他人的行为进行判断，但判断依然具有绝对化的特点。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0854","type":"judge","stem":"根据皮亚杰儿童品德发展阶段理论，处于合作道德阶段的儿童主张对犯错误者的惩罚要温和、适度，帮助他们找到犯错误的原因，以利改正。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0855","type":"judge","stem":"根据皮亚杰儿童品德发展阶段理论，儿童品德发展从可逆阶段发展到公正阶段的主要原因就是利他观念的产生。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0856","type":"judge","stem":"根据皮亚杰儿童品德发展阶段理论，处于公正道德阶段的儿童公正观念是从可逆、可变的道德认识脱胎而来的。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0857","type":"judge","stem":"根据皮亚杰儿童品德发展阶段理论，处于公正道德阶段的儿童基于公正感作出的判断仍然是平等基础上的法定关系。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0858","type":"judge","stem":"根据皮亚杰儿童品德发展阶段理论，处于公正道德阶段的儿童能将规则同整个社会和人类利益联系起来。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0859","type":"judge","stem":"根据皮亚杰儿童品德发展阶段理论，儿童的品德是从他律逐渐向自律按阶段发展的，即从服从他人的规定逐渐向服从自己内心的规定发展。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0860","type":"judge","stem":"班杜拉的社会学习理论强调了人的行为是内部过程和外界影响交互作用的产物。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0861","type":"judge","stem":"班杜拉的社会学习理论认为，环境是决定行为的潜在因素，不承认个人的认知因素、自我调节在学习过程中的作用。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0862","type":"judge","stem":"社会心理学家凯尔曼认为，个体品德的形成经历了一个由外向内的转化过程。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0863","type":"judge","stem":"认同的实质是对被认同者的模仿。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0864","type":"judge","stem":"内化是指在思想观点上与他人的思想观点一致，将自己所认同的思想和自己原有的观点、信念融为一体，形成新的价值体系的过程。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0865","type":"judge","stem":"认同是一种真正从内心深处相信并接受他人的观点，彻底改变自己的价值体系的过程。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0866","type":"judge","stem":"遵从是指个体按照规范的要求来行动，但对规范的必要性或根据缺乏认识，甚至有抵触情绪。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0867","type":"judge","stem":"遵从行为往往是个体迫于权威和情境的压力做出的，因此一旦外部监控和压力消失，相应的规范行为就可能动摇和改变。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0868","type":"judge","stem":"从品德形成的过程来看，遵从包含盲从、从众和服从三个过程。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0869","type":"judge","stem":"在社会舆论或群体气氛的压力下，个体放弃自己的意见而采取与大多数人一致的行为是服从。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0870","type":"judge","stem":"个体按照社会要求、群体规范或者权威意志而做出的行为是从众。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0871","type":"judge","stem":"道德情感是在一定的道德认识的基础上产生并随着道德认识的发展而发展的。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0872","type":"judge","stem":"一个人的道德认识水平制约着他的道德情感，高尚的道德情感总是在个体掌握一定的道德理论的基础上才能形成。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0873","type":"judge","stem":"道德情感不仅是对在道德认识基础上伴随道德行为而产生的情感体验，也具有引发与支持道德行为的作用。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0874","type":"judge","stem":"德育生活化的本质是让学生在生活体验中学会“做人”。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0875","type":"judge","stem":"德育生活化的要旨在于,引导学生通过自我感知、体认和思考,在学校文化生活中潜移默化地受到启迪和教育。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0876","type":"judge","stem":"德育生活化要求德育从时间和空间的封闭状态走向开放,重视生活事件的德育价值。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0877","type":"judge","stem":"布鲁纳认为，发现学习能帮助学生对自己的学习负责，帮助学生记住重要的信息，自己发现学习的概念与原理。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0878","type":"judge","stem":"奥苏贝尔认为接受学习并不一定就是机械的、被动的，而是有意义的，主动的。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0879","type":"judge","stem":"发展取向的教学评价思想是面向评价对象的发展，同时又是形成性教学评价的深化和发展。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0880","type":"judge","stem":"发展取向的教学评价是针对评价对象的主体性发展为根本目的的教学评价。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0881","type":"judge","stem":"学生的学习主要是掌握间接经验。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0882","type":"judge","stem":"学习是个体在特定情境下，由经验引起的行为或行为潜能的相对持久的变化。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0883","type":"judge","stem":"奥苏贝尔认为学生的学习主要是有意义的接受学习。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0884","type":"judge","stem":"程序教学的设计应遵循自由学习的原则。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0885","type":"judge","stem":"正确程序教学法是建构主义学习理论所倡导的。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0886","type":"judge","stem":"正确行为主义学习理论倡导的教学模式是合作学习。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0887","type":"judge","stem":"正确建构主义学习理论所倡导的学习方式是合作学习。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0888","type":"judge","stem":"正确认知学派学习理论强调学习不是被动地形成反应，而是主动地形成认知结构的过程。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0889","type":"judge","stem":"有意义学习的产生既受学习材料本身性质（客观条件）的影响，也受学习者自身因素（主观条件）的影响。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0890","type":"judge","stem":"奥苏贝尔认为“为迁移而教”，实际上是帮助学生形成良好的认知结构。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0891","type":"judge","stem":"概括来说，学习迁移就是一种学习对另一种学习的影响。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0892","type":"judge","stem":"迁移理论的共同要素说是以官能心理学为理论基础的。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0893","type":"judge","stem":"以官能心理学为理论基础的迁移理论是形式训练说。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0894","type":"judge","stem":"道德行为是衡量品德的重要标志。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0895","type":"judge","stem":"道德认识是人的道德需要是否得到满足而引起的一种内在体验。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0896","type":"judge","stem":"个体的道德认知与道德行为是一致的。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0897","type":"judge","stem":"根据科尔伯格的观点，道德发展的阶段性是固定的，相同年龄阶段的人都能达到同样的发展水平。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0898","type":"judge","stem":"行为实践促进了道德认识和道德行为的统一。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0899","type":"judge","stem":"品德不良行为是过错行为的开端和基础。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0900","type":"judge","stem":"品德教育是对学生知情意行的培养提高过程，应以知为开端，知情意行依次进行。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0901","type":"judge","stem":"品德是一种社会现象。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0902","type":"judge","stem":"学生课堂恶作剧属于品德不良行为。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0903","type":"judge","stem":"按照科尔伯格的品德发展理论，惩罚服从阶段的儿童只按照行为后果是否带来需求来判断行为的好坏。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0904","type":"judge","stem":"柯尔伯格采用“道德两难故事”研究道德发展问题。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0905","type":"judge","stem":"皮亚杰采用“对偶故事法”研究儿童的道德发展规律。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0906","type":"judge","stem":"皮亚杰认为公正阶段儿童的道德发展达到了成熟水平。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0907","type":"judge","stem":"他律道德阶段的儿童进行是非判断的依据主要是根据行为者的动机。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0908","type":"judge","stem":"自律道德阶段的儿童往往根据客观后果判断行为的好坏。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"xlx_0909","type":"judge","stem":"艾宾浩斯以自己为被试进行了大量的研究，发现遗忘的进程是不均衡的。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"xlx_0910","type":"j ":"B","text":"联系"},{"key":"C","text":"相对"},{"key":"D","text":"统一"}],"answer":["D"]},{"id":"zyd_0083","type":"single","stem":"下列不属于教育领域中存在的公平与效率的问题。","options":[{"key":"A","text":"地区间的经济发展不平衡所导致的教育不公平、"},{"key":"B","text":"席卷全国的“重点学校”热，扩大了人与人之间的"},{"key":"C","text":"现代社会要求每一个人最大限度发挥其潜能，这"},{"key":"D","text":"学生之间存在的智商差异，导致接受教育后出现"}],"answer":["D"]},{"id":"zyd_0084","type":"single","stem":"在我国，对平等或公平教育的挑战，不是来自种族的和性别的不平等，而是来自的不平衡和人们对达到教育目标的错误理解。","options":[{"key":"A","text":"科技发展"},{"key":"B","text":"经济发展"},{"key":"C","text":"城乡发展"},{"key":"D","text":"地区发展"}],"answer":["B"]},{"id":"zyd_0085","type":"single","stem":"下列不属于地区间的经济发展不平衡所导致的教育不公平、不平等。","options":[{"key":"A","text":"东部与西部的发展差异"},{"key":"B","text":"农村与城市的发展差异"},{"key":"C","text":"重点高中与普通高中的差异"},{"key":"D","text":"一线城市与三线城市的发展差异"}],"answer":["C"]},{"id":"zyd_0086","type":"single","stem":"“重义轻利”和“重利轻义”，都是割裂了义与利的的关系。","options":[{"key":"A","text":"相互联系"},{"key":"B","text":"相对独立"},{"key":"C","text":"相互促进"},{"key":"D","text":"辩证统一"}],"answer":["D"]},{"id":"zyd_0087","type":"single","stem":"加强师德建设是具有社会意义的重要工程，是贯彻的现实需要。","options":[{"key":"A","text":"依法治国"},{"key":"B","text":"以人为本"},{"key":"C","text":"均衡发展"},{"key":"D","text":"以德治国"}],"answer":["D"]},{"id":"zyd_0088","type":"single","stem":"高校教师在开始教育教学活动、特别是课堂讲授之前，首先要明确，使知识传授的目标服务于国家要求，这样的教育活动就不会迷失方向，而且更有针对性。","options":[{"key":"A","text":"国家道德教育的目标"},{"key":"B","text":"教育的根本目标"},{"key":"C","text":"我国素质教育的目标"},{"key":"D","text":"国家兴办教育的目标"}],"answer":["D"]},{"id":"zyd_0089","type":"single","stem":"为积极推进师德建设工作改进创新，适应新形势新任务的要求，师德建设工作必须积极推进观念创新和创新。","options":[{"key":"A","text":"制度"},{"key":"B","text":"方法"},{"key":"C","text":"理念"},{"key":"D","text":"方式"}],"answer":["A"]},{"id":"zyd_0090","type":"single","stem":"教学的出发点和归宿都是为了。","options":[{"key":"A","text":"提高学生成绩"},{"key":"B","text":"促进学生的认识和发展"},{"key":"C","text":"提高学校知名度"},{"key":"D","text":"彰显教师水平"}],"answer":["B"]},{"id":"zyd_0091","type":"single","stem":"各级各类学校要把摆在教师工作的首位，贯穿于管理工作的全过程。","options":[{"key":"A","text" "type":"single","stem":"从教育手段上看，教书育人是一种持续行为，主要有两个途径：一是通过高校教师课堂内外的教学科研和社会服务的各环节来实现；二是通过言传身教来完成，其中。","options":[{"key":"A","text":"言传等于身教"},{"key":"B","text":"身教重于言传"},{"key":"C","text":"言传重于身教"},{"key":"D","text":"身教轻于言传"}],"answer":["B"]},{"id":"zyd_0102","type":"single","stem":"教书育人，是指教师要根据的需要和学生身心发展的规律，在教育教学的过程中，既传授科学文化知识，又进行思想品德教育，把学生培养成为德智体诸方面全面发展的一代新人。","options":[{"key":"A","text":"社会发展"},{"key":"B","text":"科研"},{"key":"C","text":"实践"},{"key":"D","text":"教学"}],"answer":["A"]},{"id":"zyd_0103","type":"single","stem":"不是教书育人的重要途径。","options":[{"key":"A","text":"严谨治学"},{"key":"B","text":"仅注重应试能力"},{"key":"C","text":"言传身教"},{"key":"D","text":"重视教学全过程"}],"answer":["B"]},{"id":"zyd_0104","type":"single","stem":"对于所有学校来说，是中心工作。","options":[{"key":"A","text":"育人"},{"key":"B","text":"实践"},{"key":"C","text":"科研"},{"key":"D","text":"教学"}],"answer":["D"]},{"id":"zyd_0105","type":"single","stem":"教书育人概括了教师劳动的全部内容，是教育行为的宗旨，是教师的核心。","options":[{"key":"A","text":"科研能力"},{"key":"B","text":"职业道德"},{"key":"C","text":"管理能力"},{"key":"D","text":"教学能力"}],"answer":["B"]},{"id":"zyd_0106","type":"single","stem":"教师在履行教育义务的活动中，最主要、最基本的道德责任是。","options":[{"key":"A","text":"教书育人"},{"key":"B","text":"团结协作"},{"key":"C","text":"依法执教"},{"key":"D","text":"爱岗敬业"}],"answer":["A"]},{"id":"zyd_0107","type":"single","stem":"教书和育人的紧密结合，其结果必然是学生的。","options":[{"key":"A","text":"品德优秀"},{"key":"B","text":"性格开朗"},{"key":"C","text":"德才兼备"},{"key":"D","text":"成绩优异"}],"answer":["C"]},{"id":"zyd_0108","type":"single","stem":"教书是指在课堂上向学生传授系统的科学文化知识，培养学生的科学文化素质，发展学生的。","options":[{"key":"A","text":"品德"},{"key":"B","text":"性格"},{"key":"C","text":"情商"},{"key":"D","text":"智能"}],"answer":["D"]},{"id":"zyd_0109","type":"single","stem":"扎实的，是一个合格教师的基本要求，是进一步提高自身素质的基础。","options":[{"key":"A","text":"教学基本功"},{"key":"B","text":"学习能力"},{"key":"C","text":"实践能力"},{"key":"D","text":"科研能力"}],"answer":["A"]},{"id":"zyd_0110","type":"single","stem":"练就扎实的教学基本功，要靠爱岗敬业的精神，要靠长期反复的苦练，其核心是二字。","options":[{"key":"A","text":"耐心"},{"key":"B","text":"热情"},{"key":"C","text":"认真"},{"key":"D","text":"创新"}],"answer":["C"]},{"id":"zyd_0111","type":"single","stem":"广义上严谨治学是指教师对于科研和学术问题具有的的态度和行为。","options":[{"key":"A","text":"严谨规范"},{"key":"B","text":"实事求是"},{"key":"C","text":"勇于创新"},{"key":"D","text":"循规蹈矩"}],"answer":["B"]},{"id":"zyd_0112","type":"single","stem":"教师在求知、教学过程中要做到严密谨慎、严格细致，所以教师必须。","options":[{"key":"A","text":"严谨治学"},{"key":"B","text":"实事求是"},{"key":"C","text":"理论联系实际"},{"key":"D","text":"与时俱进"}],"answer":["A"]},{"id":"zyd_0113","type":"single","stem":"严谨治学，包含两层意思：一是认真完成教学任务，以负责的态度对待教学；二是以严谨的态度，提高。","options":[{"key":"A","text":"实践能力"},{"key":"B","text":"教育教学和研究水平"},{"key":"C","text":"管理能力"},{"key":"D","text":"职业水准"}],"answer":["B"]},{"id":"zyd_0114","type":"single","stem":"高校教师的心理健康水平对有直接影响。","options":[{"key":"A","text":"社会"},{"key":"B","text":"家长"},{"key":"C","text":"领导"},{"key":"D","text":"在校学生"}],"answer":["D"]},{"id":"zyd_0115","type":"single","stem":"教师的社会角色决定师德内在要求必须是的统一。","options":[{"key":"A","text":"才与学"},{"key":"B","text":"学与教"},{"key":"C","text":"学与练"},{"key":"D","text":"德与识"}],"answer":["D"]},{"id":"zyd_0116","type":"single","stem":"在具体的教育和教学的活动中，教师还必须处理多种人际关系，其中的关系是教育活动中人与人之间最基本也是最重要的关系。","options":[{"key":"A","text":"教师与领导"},{"key":"B","text":"教师与教师"},{"key":"C","text":"教师与学生"},{"key":"D","text":"教师与家长"}],"answer":["C"]},{"id":"zyd_0117","type":"single","stem":"要想使教师的职责落到实处，使教育获得成功，首先必须建立良好的关系。","options":[{"key":"A","text":"师生"},{"key":"B","text":"同事"},{"key":"C","text":"教师与家长"},{"key":"D","text":"上下级"}],"answer":["A"]},{"id":"zyd_0118","type":"single","stem":"加强和改进师德建设的总体要求以、教书育人为核心，以学为人师、行为世范为准则。","options":[{"key":"A","text":"热爱实践"},{"key":"B","text":"热爱科研"},{"key":"C","text":"热爱工作"},{"key":"D","text":"热爱学生"}],"answer":["D"]},{"id":"zyd_0119","type":"single","stem":"托尔斯泰说：“如果一个教师把热爱事业和热爱学生结合起来，他就是一个完美的教师。”这意味着教师要。","options":[{"key":"A","text":"把热爱事业与热爱学生结合起来"},{"key":"B","text":"严格要求学生，对学生一视同仁"},{"key":"C","text":"尊重学生、信任学生"},{"key":"D","text":"关心学生、了解学生"}],"answer":["A"]},{"id":"zyd_0120","type":"single","stem":"孔子说：“其身正，不令而行；其身不正，虽令不从。”从教师的角度来说，“其身正，不令而行”可以理解为。","options":[{"key":"A","text":"教师自己以身作则，其一言一行都会对学生产生"},{"key":"B","text":"自己做好了，不要教育学生，学生自然会学好"},{"key":"C","text":"对学生下命令一定要正确"},{"key":"D","text":"走路身体一定要端正"}],"answer":["A"]},{"id":"zyd_0121","type":"single","stem":"教师教育学生的感情基础是。","options":[{"key":"A","text":"爱教育事业"},{"key":"B","text":"爱学校"},{"key":"C","text":"爱学生"},{"key":"D","text":"爱工作"}],"answer":["C"]},{"id":"zyd_0122","type":"single","stem":"孔子提出“有教无类”的主张，体现了师德规范的。","options":[{"key":"A","text":"为人师表"},{"key":"B","text":"热爱学生"},{"key":"C","text":"依法执教"},{"key":"D","text":"严谨治学"}],"answer":["B"]},{"id":"zyd_0123","type":"single","stem":"教师在教育教学中应当平等对待学生，关注学生的，因材施教，促进学生的实际发展。","options":[{"key":"A","text":"学习基础"},{"key":"B","text":"特点"},{"key":"C","text":"个性"},{"key":"D","text":"个体差异"}],"answer":["D"]},{"id":"zyd_0124","type":"single","stem":"公平、合理地对待和评价每名学生，是教育公正的要求。","options":[{"key":"A","text":"最重要"},{"key":"B","text":"最根本"},{"key":"C","text":"最早"},{"key":"D","text":"最先"}],"answer":["B"]},{"id":"zyd_0125","type":"single","stem":"热爱是教师所特有的一种职业情感，是良好师生关系得以存在和发展的基础，是搞好教育教学工作的重要因素。","options":[{"key":"A","text":"工作"},{"key":"B","text":"学生"},{"key":"C","text":"教育"},{"key":"D","text":"学校"}],"answer":["B"]},{"id":"zyd_0126","type":"single","stem":"教师与学生沟通的基本技巧，也是在沟通中认识与了解学生的第一步是。","options":[{"key":"A","text":"积极倾听"},{"key":"B","text":"采用书面形式"},{"key":"C","text":"善用表扬"},{"key":"D","text":"换位思考"}],"answer":["A"]},{"id":"zyd_0127","type":"single","stem":"“弟子不必不如师，师不必贤于弟子，闻道有先后，术业有专攻，如是而已”，这种观点给当今教育的启示是。","options":[{"key":"A","text":"严于律己，为人师表"},{"key":"B","text":"有教无类，教书育人"},{"key":"C","text":"乐教善教，讲究教法"},{"key":"D","text":"教学相长，相互尊重"}],"answer":["D"]},{"id":"zyd_0128","type":"single","stem":"教师公正的核心是。","options":[{"key":"A","text":"对同事公正"},{"key":"B","text":"对上级公正"},{"key":"C","text":"对学生公正"},{"key":"D","text":"对自己的公正"}],"answer":["C"]},{"id":"zyd_0129","type":"single","stem":"有个经济困难的大学生，也比较要面子，不愿接受资助，老师给安排了勤工助学岗位，但仍然不能满足生活需求，辅导员知道后，又给也安排了一份家教，帮助这个同学渡过了生活上的困难。这个老师体现的是教师职业道德中的。","options":[{"key":"A","text":"严谨治学"},{"key":"B","text":"服务社会"},{"key":"C","text":"爱国守法"},{"key":"D","text":"敬业爱生"}],"answer":["D"]},{"id":"zyd_0130","type":"single","stem":"把育人看成是教学工作之外的一项工作，这就割断了教书育人之间的有机的，从而会产生那种“只教书、不育人”或“教师教书、党政干部、辅导员育人”的倾向。","options":[{"key":"A","text":"必然联系"},{"key":"B","text":"内在联系"},{"key":"C","text":"重要联系"},{"key":"D","text":"相对联系"}],"answer":["B"]},{"id":"zyd_0131","type":"single","stem":"高校教师是一名公民，他与大学生是平等的个体，两者之间是互相的关系。","options":[{"key":"A","text":"学习"},{"key":"B","text":"爱护"},{"key":"C","text":"尊重"},{"key":"D","text":"理解"}],"answer":["C"]},{"id":"zyd_0132","type":"single","stem":"高校教师应常以服务为宗旨，把对大学生的爱融于高质量的服务过程中，这是师爱的体现。","options":[{"key":"A","text":"无私性"},{"key":"B","text":"服务性"},{"key":"C","text":"真实性"},{"key":"D","text":"伟大性"}],"answer":["B"]},{"id":"zyd_0133","type":"single","stem":"下列属于教师热爱学生所具有的全面性的特点。","options":[{"key":"A","text":"教师要关心每个学生的全面成长，做到不偏爱，"},{"key":"B","text":"教师热爱学生不是溺爱而是严慈相济"},{"key":"C","text":"教师用自己的心血哺育下一代"},{"key":"D","text":"教师对学生的爱是由从事教育职业中产生的"}],"answer":["A"]},{"id":"zyd_0134","type":"single","stem":"教师关心爱护学生的具体要求不包括。","options":[{"key":"A","text":"要爱护每一个学生"},{"key":"B","text":"要成为学生的知心朋友"},{"key":"C","text":"要加强科研工作"},{"key":"D","text":"要了解和信任学生"}],"answer":["C"]},{"id":"zyd_0135","type":"single","stem":"下列是教师平等对待和尊重学生的表现。","options":[{"key":"A","text":"不信任学习成绩差的学生"},{"key":"B","text":"对先进生和后进生一视同仁"},{"key":"C","text":"对学习差的学生漠不关心"},{"key":"D","text":"不论对错，训斥甚至体罚学生"}],"answer":["B"]},{"id":"zyd_0136","type":"single","stem":"教师对学生的爱，要与“严”紧密结合在一起，做到严中有细，下列属于严中有细的具体做法。","options":[{"key":"A","text":"教师对学生的严格要求要保持稳定性，不能放松"},{"key":"B","text":"教师对学生提出的一切要求都有符合党的教育"},{"key":"C","text":"教师要善于从细节处关心学生，发现问题，及时"},{"key":"D","text":"教师对学生提出的各种要求都要符合学生的实"}],"answer":["C"]},{"id":"zyd_0137","type":"single","stem":"所谓为人师表是指教师要在各方面都应该成为学生和社会上人们效法的表率、榜样和楷模。这一涵义是由。","options":[{"key":"A","text":"法律法规决定的"},{"key":"B","text":"传统习俗决定的"},{"key":"C","text":"社会舆论决定的"},{"key":"D","text":"教师的工作对象决定的"}],"answer":["D"]},{"id":"zyd_0138","type":"single","stem":"是树立教师威信的基础。","options":[{"key":"A","text":"有商有量"},{"key":"B","text":"严肃认真"},{"key":"C","text":"言出必行"},{"key":"D","text":"为人师表"}],"answer":["D"]},{"id":"zyd_0139","type":"single","stem":"在我们社会主义国家，教师与社会、教师与学校、之间的根本利益是一致的，教师劳动的目的，学校教育的目的与社会发展的目标也是一致的。","options":[{"key":"A","text":"教师与教师"},{"key":"B","text":"教师与领导"},{"key":"C","text":"教师与家长"},{"key":"D","text":"教师与学生"}],"answer":["A"]},{"id":"zyd_0140","type":"single","stem":"在现代社会，教师与学生家长的社会地位应该是。","options":[{"key":"A","text":"对立的"},{"key":"B","text":"互补的"},{"key":"C","text":"平等的"},{"key":"D","text":"不平等的"}],"answer":["C"]},{"id":"zyd_0141","type":"single","stem":"下列不属于教师与教师之间关系中产生的不良现象。","options":[{"key":"A","text":"对其他教师的工作不关心不过问不配合"},{"key":"B","text":"通过发现其他教师的优点，认识自己的不足"},{"key":"C","text":"过高的评价自己的贡献，忽视或否定其他教师的"},{"key":"D","text":"不能正确对待竞争，对超过自己的教师嫉妒、排"}],"answer":["B"]},{"id":"zyd_0142","type":"single","stem":"一个教师能否处理好与同事之间的关系，是衡量其素质和水平的标志之一。","options":[{"key":"A","text":"科研"},{"key":"B","text":"管理"},{"key":"C","text":"教学"},{"key":"D","text":"道德修养"}],"answer":["D"]},{"id":"zyd_0143","type":"single","stem":"学校实施青年教师成长“导师制”，作为导师的李老师手把手地对青年教师进行“传”“帮”“带”，体现了李老师。","options":[{"key":"A","text":"廉洁从教、勤恳敬业"},{"key":"B","text":"因材施教，乐于奉献"},{"key":"C","text":"团结协作，甘为人梯"},{"key":"D","text":"治学严谨，勇于创新"}],"answer":["C"]},{"id":"zyd_0144","type":"single","stem":"教师须随时补充、更新、调整自己的知识库，跟上时代发展的需要，一方面要向书本学习，另一方面还要向学习。","options":[{"key":"A","text":"社会"},{"key":"B","text":"家长"},{"key":"C","text":"学生"},{"key":"D","text":"领导"}],"answer":["A"]},{"id":"zyd_0145","type":"single","stem":"教学过程是信息传递的过程，信息传递的主要载体是教师的。","options":[{"key":"A","text":"仪表"},{"key":"B","text":"风度"},{"key":"C","text":"外貌"},{"key":"D","text":"语言"}],"answer":["D"]},{"id":"zyd_0146","type":"single","stem":"教师的最直接反映教师的道德风貌和审美情趣，对学生具有重要的道德意义和审美价值。","options":[{"key":"A","text":"语言"},{"key":"B","text":"仪表"},{"key":"C","text":"风度"},{"key":"D","text":"纪律"}],"answer":["B"]},{"id":"zyd_0147","type":"single","stem":"良好的仪表能获得学生的认同和敬重，糟糕的仪表会引起学生的反感，下列是得体的教师形象。","options":[{"key":"A","text":"浓妆艳抹"},{"key":"B","text":"奇装异服"},{"key":"C","text":"精神萎靡"},{"key":"D","text":"朴素端庄"}],"answer":["D"]},{"id":"zyd_0148","type":"single","stem":"作为知识的传播者，教师的知识结构具有三个特征：一是广泛深厚的文化科学基础知识，二是扎实系统精深的专业学科知识，三是全面准确的知识。","options":[{"key":"A","text":"教育学和心理学"},{"key":"B","text":"社会学"},{"key":"C","text":"管理学"},{"key":"D","text":"传播学"}],"answer":["A"]},{"id":"zyd_0149","type":"single","stem":"教师在教育教学活动中，严格按照《宪法》和教育方面的法律、法规以及其他相关的法律、法规，使自己的教育教学活动符合法制化，这就是。","options":[{"key":"A","text":"严谨治学"},{"key":"B","text":"热爱学生"},{"key":"C","text":"爱岗敬业"},{"key":"D","text":"依法执教"}],"answer":["D"]},{"id":"zyd_0150","type":"single","stem":"教师依法执教，就必须在教育教学活动中全面贯彻规定的国家教育方针。","options":[{"key":"A","text":"《高等教育法》"},{"key":"B","text":"《教育法》"},{"key":"C","text":"《职业教育法》"},{"key":"D","text":"《教师法》"}],"answer":["B"]},{"id":"zyd_0151","type":"single","stem":"教师的劳动固然需要统一的教育信念、教育价值目标，需要集体的力量，但在其表现形式上更多地是劳动。","options":[{"key":"A","text":"集体"},{"key":"B","text":"个体"},{"key":"C","text":"协作"},{"key":"D","text":"复杂"}],"answer":["B"]},{"id":"zyd_0152","type":"single","stem":"教师在执行自己的各项具体任务时，其态度、方式、方法的选择总是自主的，是一个自我控制的系统，是由教师凭借自己的和良心来调节的。","options":[{"key":"A","text":"教学能力"},{"key":"B","text":"科研水平"},{"key":"C","text":"实践能力"},{"key":"D","text":"道德修养水平"}],"answer":["D"]},{"id":"zyd_0153","type":"single","stem":"教师职业道德由他律向自律发展，需要将教师职业道德内化为教师道德。","options":[{"key":"A","text":"集体"},{"key":"B","text":"个体"},{"key":"C","text":"统一"},{"key":"D","text":"整体"}],"answer":["B"]},{"id":"zyd_0154","type":"single","stem":"个体道德心理，是指个体具有意义的心理活动和心理机制，按中国传统的说法，可简称为“德心”。","options":[{"key":"A","text":"好坏"},{"key":"B","text":"是非"},{"key":"C","text":"善恶"},{"key":"D","text":"对错"}],"answer":["C"]},{"id":"zyd_0155","type":"single","stem":"教师的在道德教育中的作用是巨大的，是任何教科书、任何道德箴言、任何奖惩制度所不能代替的一种教育力量。","options":[{"key":"A","text":"个人能力"},{"key":"B","text":"外貌着装"},{"key":"C","text":"道德面貌"},{"key":"D","text":"仪态风度"}],"answer":["C"]},{"id":"zyd_0156","type":"single","stem":"是传播社会先进思想的主要阵地和重要场所，教师身处教书育人的岗位，是正义公正的化身。","options":[{"key":"A","text":"家庭"},{"key":"B","text":"政府"},{"key":"C","text":"宣传机构"},{"key":"D","text":"学校"}],"answer":["D"]},{"id":"zyd_0157","type":"single","stem":"教师现代化体现在道德领域里，就是指教师应当具有与现代文明和教育相应的道德思想观念和。","options":[{"key":"A","text":"价值取向"},{"key":"B","text":"工作能力"},{"key":"C","text":"教学水平"},{"key":"D","text":"科研能力"}],"answer":["A"]},{"id":"zyd_0158","type":"single","stem":"古代教师职业道德规范，修身、齐家、治国、平天下，强调个人道德与社会道德的统一，其中，是基础。","options":[{"key":"A","text":"修身"},{"key":"B","text":"齐家"},{"key":"C","text":"治国"},{"key":"D","text":"平天下"}],"answer":["A"]},{"id":"zyd_0159","type":"single","stem":"荀子说：“知明而行无过”，在教师职业道德要求内化的过程中，首先要解决的问题。","options":[{"key":"A","text":"道德意志"},{"key":"B","text":"道德行为"},{"key":"C","text":"道德认识"},{"key":"D","text":"道德情感"}],"answer":["C"]},{"id":"zyd_0160","type":"single","stem":"与人类普遍的认识过程一样，教师职业道德认识一般要经过从感性认识到理性认识，再从理性认识到这样两个阶段。","options":[{"key":"A","text":"道德情感"},{"key":"B","text":"道德实践"},{"key":"C","text":"道德认识"},{"key":"D","text":"道德信念"}],"answer":["B"]},{"id":"zyd_0161","type":"single","stem":"提高教师职业道德认识，不仅要掌握职业道德的基本知识，而且还要在实际生活中培养道德能力。","options":[{"key":"A","text":"评价判断"},{"key":"B","text":"实践"},{"key":"C","text":"内化"},{"key":"D","text":"自律"}],"answer":["A"]},{"id":"zyd_0162","type":"single","stem":"循序渐进地提高教师个体的职业水平，是教师职业道德要求内化的首要条件。","options":[{"key":"A","text":"道德意志"},{"key":"B","text":"道德行为"},{"key":"C","text":"道德认识"},{"key":"D","text":"道德情感"}],"answer":["C"]},{"id":"zyd_0163","type":"single","stem":"教师的道德情感极为丰富，表现在很多方面，是教师道德情感的核心。","options":[{"key":"A","text":"对同事的尊重和友谊"},{"key":"B","text":"教师的责任感和荣誉感"},{"key":"C","text":"对教育事业的热爱和对学生的关爱"},{"key":"D","text":"对教学与科研的认真态度"}],"answer":["C"]},{"id":"zyd_0164","type":"single","stem":"教师的职业道德情感是在职业的基础上形成的，并对职业道德认识和道德行为有着稳定的调节作用。","options":[{"key":"A","text":"道德认识"},{"key":"B","text":"道德行为"},{"key":"C","text":"道德信念"},{"key":"D","text":"道德意志"}],"answer":["A"]},{"id":"zyd_0165","type":"single","stem":"教师职业道德信念，是教师对职业道德规范和要求的正当性、合理性等发自内心的坚定信心，教师的职业道德理想和是道德信念的最高形式。","options":[{"key":"A","text":"价值观"},{"key":"B","text":"世界观"},{"key":"C","text":"教育观"},{"key":"D","text":"人生观"}],"answer":["D"]},{"id":"zyd_0166","type":"single","stem":"对行为目的有明确而深刻的认识，并使个人的行为完全符合正确目的的意志品质是教师职业道德意志的的表现。","options":[{"key":"A","text":"坚持性"},{"key":"B","text":"自觉性"},{"key":"C","text":"自制性"},{"key":"D","text":"果断性"}],"answer":["B"]},{"id":"zyd_0167","type":"single","stem":"善于掌握和支配自己言行的意志品质，当客观现实诱发不利于实现教育目的的情绪冲动时，教师能控制自己的情绪，冷静的把握言行和分寸，这是教师职业道德意志的表现。","options":[{"key":"A","text":"坚持性"},{"key":"B","text":"自觉性"},{"key":"C","text":"自制性"},{"key":"D","text":"果断性"}],"answer":["C"]},{"id":"zyd_0168","type":"single","stem":"职业道德内化的过程不只是由社会道德意识内化为个体道德意识，而是还要在个体的中体现出来。","options":[{"key":"A","text":"道德信念"},{"key":"B","text":"道德行为"},{"key":"C","text":"道德意志"},{"key":"D","text":"道德认识"}],"answer":["B"]},{"id":"zyd_0169","type":"single","stem":"道德行为作为道德品质的外部状态，表现为和行为习惯。","options":[{"key":"A","text":"仪态"},{"key":"B","text":"语言"},{"key":"C","text":"着装"},{"key":"D","text":"精神状态"}],"answer":["B"]},{"id":"zyd_0170","type":"single","stem":"教师是教师个体道德意识的具体表现和外部标志。","options":[{"key":"A","text":"道德认识"},{"key":"B","text":"道德意志"},{"key":"C","text":"道德信念"},{"key":"D","text":"道德行为"}],"answer":["D"]},{"id":"zyd_0171","type":"single","stem":"教师思想道德水平的提高，是和个人修养的结果。","options":[{"key":"A","text":"社会道德教育"},{"key":"B","text":"社会道德评价"},{"key":"C","text":"个人教学能力提升"},{"key":"D","text":"个人科研水平提升"}],"answer":["A"]},{"id":"zyd_0172","type":"single","stem":"在教师道德教育的过程中，接受教育的对象本身是道德的教育者，教师道德教育应该社会一般成员的道德标准。","options":[{"key":"A","text":"低于"},{"key":"B","text":"高于"},{"key":"C","text":"等同于"},{"key":"D","text":"区别于"}],"answer":["B"]},{"id":"zyd_0173","type":"single","stem":"教师职业道德修养包含两个方面，一个是职业道德意识修养，另一个是。","options":[{"key":"A","text":"职业技术修养"},{"key":"B","text":"职业理念修养"},{"key":"C","text":"职业道德行为修养"},{"key":"D","text":"科学文化修养"}],"answer":["C"]},{"id":"zyd_0174","type":"single","stem":"教师的师德修养，只有在中才能得到不断的充实、提高和完善。","options":[
