":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0379","type":"judge","stem":"2018年9月，习近平在全国教育大会发表讲话，强调思想政治工作是学校各项工作的生命线。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0380","type":"judge","stem":"2019年3月，习近平主持召开学校思想政治理论课教师座谈会强调，我们办中国特色社会主义教育，就是要理直气壮开好思政课，用新时代中国特色社会主义思想铸魂育人。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0381","type":"judge","stem":"2019年3月，习近平主持召开学校思想政治理论课教师座谈会强调，思想政治理论课是落实立德树人根本任务的关键课程。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0382","type":"judge","stem":"2014年9月，教育部出台了《关于建立健全高校师德建设长效机制的意见》，强调创新师德教育，引导教师树立崇高理想，将师德教育摆在高校教师培养首位，贯穿高校教师职业生涯全过程。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0383","type":"judge","stem":"2014年9月，教育部出台了《关于建立健全高校师德建设长效机制的意见》指出，高校是师德建设的责任主体，教师是师德建设的第一责任人。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0384","type":"judge","stem":"道德是人们共同生活及其行为的准则与规范，往往代表着社会的正面价值取向，起判断行为正当与否的作用。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0385","type":"judge","stem":"注重师德的修炼，需要做到树立正确的价值观，加强学习意识的提升，注重实践行为的锻炼以及注重科研能力的提升。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0386","type":"judge","stem":"《中华人民共和国教师法》是我国教育工作的根本大法，是依法治教的根本大法。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0387","type":"judge","stem":"在中华人民共和国境内的各级各类教育，适用《中华人民共和国高等教育法》。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0388","type":"judge","stem":"教育是社会主义现代化建设的基础，国家保障经济事业优先发展。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0389","type":"judge","stem":"国家实行教育与宗教相分离，任何组织和个人不得利用宗教进行妨碍国家教育制度的活动。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0390","type":"judge","stem":"公民不分民族、种族、性别、职业、财产状况、宗教信仰等，依法享有平等的受教育机会。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0391","type":"judge","stem":"学校及其他教育机构进行教学，应当推广使用全国通用的普通话和英语。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0392","type":"judge","stem":"汉语言文字为学校及其他教育机构的基本教学语言文字，不可使用少数民族通用的语言文字进行教学。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0393","type":"judge","stem":"任何组织和个人不得以营利为目的举办学校及其他教育机构。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0394","type":"judge","stem":"国家举办学校及其他教育机构，应当坚持勤俭节约的原则。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0395","type":"judge","stem":"学校及其他教育机构的校长或者主要行政负责人可以由外国人担任。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0396","type":"judge","stem":"学校及其他教育机构中的所有资产属于国家所有。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0397","type":"judge","stem":"从业人员有依法接受职业培训和继续教育的权利和义务","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0398","type":"judge","stem":"企业事业组织、社会团体及其他社会组织和个人，可以通过适当形式，参与学校管理。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0399","type":"judge","stem":"国家不允许境外社会组织和个人捐资助学。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0400","type":"judge","stem":"中国公民在各级各类学校和其他教育机构中专门从事教育教学工作，应当依法取得教师资格证。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0401","type":"judge","stem":"国家财政性教育经费、社会组织和个人对教育的捐赠，必须用于教育。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0402","type":"judge","stem":"教师要认真学习宪法和有关法律法规，坚持学术研究有禁区、课堂讲授有纪律，严格教育教学纪律。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0403","type":"judge","stem":"教师可以在“教书”实践中贯彻落实教育法律法规和其它相关的方针和政策。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0404","type":"judge","stem":"如果符合实际工作需要，学校可以聘用曾经因故意犯罪被依法剥夺政治权利的人担任工作人员。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0405","type":"judge","stem":"国家实行教师资格、职务聘任制度，通过考核、奖励、培养和培训，提高教师素质，加强教师队伍建设。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0406","type":"judge","stem":"国家鼓励运用金融、信贷手段，支持教育事业的发展。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0407","type":"judge","stem":"国家举办的高等学校实行中国共产党高等学校基层委员会领导下的校长负责制。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0408","type":"judge","stem":"高等学校的管理人员，实行专业技术职务聘任制度。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0409","type":"judge","stem":"高等学校的举办者应当保证稳定的办学经费来源，不得抽回其投入的办学资金。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0410","type":"judge","stem":"国家不允许企业事业组织、社会团体及其他社会组织和公民等社会力量依法举办高等学校。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0411","type":"judge","stem":"高等学校必须招收符合国家规定的录取标准的残疾学生入学，不得因其残疾而拒绝招收。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0412","type":"judge","stem":"《中华人民共和国教师法》规定教师有义务组织、带领学生开展有益的社会活动。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0413","type":"judge","stem":"取得高等学校教师资格，应当具备研究生或者大学本科毕业学历。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0414","type":"judge","stem":"教师资格一经取得即在全国范围内具有普遍的适用效力。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0415","type":"judge","stem":"取得教师资格的人员首次任教时，没有试用期。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0416","type":"judge","stem":"社会力量所办学校的教师的待遇，由国家确定并予以保障。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0417","type":"judge","stem":"学位分学士、硕士、博士、博士后四级","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0418","type":"judge","stem":"对于在科学或专门技术上有重要的著作、发明、发现或发展者，经有关专家推荐，学位授予单位同意，可以免除考试，直接参加博士学位论文答辩。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0419","type":"judge","stem":"在我国学习的外国留学生和从事研究工作的外国学者，不得向学位授予单位申请学位。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0420","type":"judge","stem":"国家实行劳动者在就业前或者上岗前接受必要的职业教育的制度。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0421","type":"judge","stem":"从事技术工种的职工，上岗前必须经过培训。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0422","type":"judge","stem":"社会主义市场经济的发展，对教师素质的提高带来积极的影响，没有任何消极作用。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0423","type":"judge","stem":"商品都必须在交换中通过个别劳动的转移，即通过等价交换来实现商品价值，这一特点对教师职业道德的影响均是积极正面的，无负面影响。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0424","type":"judge","stem":"市场经济的竞争特点有利于增强教师的自强意识和创新精神，使教学工作充满活力。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0425","type":"judge","stem":"教育不是社会主义经济中的生产、经营活动，因此与市场经济不存在任何联系。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0426","type":"judge","stem":"教育应该适应市场经济的需要，同时又需保持自身的独立性，不能把教育等同于一般产业或企业推向市场。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0427","type":"judge","stem":"广大教师应当正确认识和处理义与利的关系，树立社会主义义利统一观。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0428","type":"judge","stem":"公平与效率互为条件、互相促进，在公平与效率的两难选择中，应坚持公平优先，兼顾效率。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0429","type":"judge","stem":"热爱教育是对教师的基本要求，乐于奉献是人民教师的本色。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0430","type":"judge","stem":"真正要在教育事业上有所作为，真正当好一名合格乃至出色的教师，一个基本的要求就是要热爱教师职业。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0431","type":"judge","stem":"在我国，教育已和农业、能源、交通、科技一样，成为现代化建设的战略重点，教育已成为社会发展的第一需要。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0432","type":"judge","stem":"教书育人既是教师的基本职责，又是学生应当遵循的道德规范。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0433","type":"judge","stem":"教书和育人是不可分割的统一体，二者相互作用、相互渗透、相辅相成。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0434","type":"judge","stem":"育人是指只需在课堂上向学生传授系统的科学文化知识，培养学生的科学文化素质，发展学生的智能。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0435","type":"judge","stem":"教书是手段，育人是目的。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0436","type":"judge","stem":"教书是育人的手段，教好书是教师的主要职责。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0437","type":"judge","stem":"要把育人的工作做好，就要遵循教育规律，按教育规律办事。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0438","type":"judge","stem":"加强教育科研，是促进教育改革和发展，建立教育体系的必要措施。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0439","type":"judge","stem":"有些教师的教学任务重，时间少，因此可以不用从事科研。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0440","type":"judge","stem":"一个教师不热爱自己的工作对象，就不会真正热爱自己所从事的教书育人工作。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0441","type":"judge","stem":"处理好师生关系，不仅是教育教学的需要，也是社会对教师职业道德的最基本要求。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0442","type":"judge","stem":"师生关系是否和谐融洽，不仅决定学生的学习成绩，而且直接决定学生的人生观、世界观的形成，乃至影响着学生的一生。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0443","type":"judge","stem":"教师对学生的爱，无异于一般的人与人之间的爱，来源于教师的某种单纯的个人需求。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0444","type":"judge","stem":"根据学习成绩的好坏，教师可以将学生分为三六九等。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0445","type":"judge","stem":"教师关心爱护学生，可以迁就学生、放任学生、溺爱学生。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0446","type":"judge","stem":"尊重和接纳学生就是赞同学生的所有行为。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0447","type":"judge","stem":"师生关系是教育工作中最主要的一对矛盾关系。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0448","type":"judge","stem":"教师与学生关系中的道德要求很多，从其实质来说，就是要做到为人师表，以身作则。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0449","type":"judge","stem":"所谓师表美就是教师的穿着打扮等外在形象之美。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0450","type":"judge","stem":"教师为人师表，以身作则，是影响学生最好的资源。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0451","type":"judge","stem":"教师之所以要做到为人师表，是由教师个人素质决定的。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0452","type":"judge","stem":"现代教育特别需要教师具有群体意识，发扬协作精神。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0453","type":"judge","stem":"教师自身素质和能力水平的提高，仅靠自己的勤奋和自律就足够了。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0454","type":"judge","stem":"担任同一学科的教师要互相帮助，不同学科的老师则不需要交流互助。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0455","type":"judge","stem":"没有团结一致的学校集体，特别是教师集体，是不可能完成教育和教学任务的。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0456","type":"judge","stem":"学校领导者只需提高管理水平，不必研究教学业务。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0457","type":"judge","stem":"教师的言表风纪包括语言、仪表、风度、法纪等方面的丰富内容，是指教师在职业活动中，表现出来的行为方式的总和。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0458","type":"judge","stem":"一个教师的举止既体现了他的道德修养、文化水平，又表现出他与别人交往的诚意。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0459","type":"judge","stem":"教师风度的精神内涵包括“稳重”、“可亲”和“有识”。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0460","type":"judge","stem":"依法执教是教师的责任，与学生、家长、学校、社会毫无关系。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0461","type":"judge","stem":"依法执教，是人民教师言传身教培养人才的重要保证和道德要求。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0462","type":"judge","stem":"全面提高教育质量的关键是教师，全面贯彻教育方针、实施素质教育的关键是学生。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0463","type":"judge","stem":"只有实现教师职业道德要求的内化，教师职业道德才能由他律向自律转化。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0464","type":"judge","stem":"教师职业道德内化的目的，是把自律的道德原则及规范转变为教师个体内在的道德品质。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0465","type":"judge","stem":"掌握道德要领，是教师职业道德认识的感性阶段，是道德认识概括化过程。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0466","type":"judge","stem":"职业道德认识的理性阶段，是职业道德观念的形成和积累。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0467","type":"judge","stem":"不必经过职业道德认识阶段，直接就可以培养职业道德行为习惯。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0468","type":"judge","stem":"教师职业道德信念，是教师对职业道德规范和要求的正当性、合理性等发自内心的坚定信心。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0469","type":"judge","stem":"教师职业道德意志是教师在履行职业道德义务的过程中，自觉地克服困难并作出行为抉择的毅力和坚持精神。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0470","type":"judge","stem":"教师职业道德意志的自觉性就是在行动中坚持目标、百折不挠的克服困难的品质。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0471","type":"judge","stem":"道德认识、道德情感、道德意志和道德信念属于道德意识领域，构成了主体的道德品质。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0472","type":"judge","stem":"教师是精神文明的宣传者，同时也是精神文明的实践者。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0473","type":"judge","stem":"社会道德教育是促进教师职业道德要求内化的重要条件。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0474","type":"judge","stem":"对教师进行道德教育的过程也正是教师道德要求内化的过程。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0475","type":"judge","stem":"教师个体道德不应只停留在“自律”的阶段，更重要的应该是“他律”，关键就在于教师道德修养。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0476","type":"judge","stem":"每一个教师都应该自觉地、不断锻炼和改造自己，以达到“慎独”的境界。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0477","type":"judge","stem":"师德修养，关键在于提高修养的自觉性，这是由道德和道德修养的特点决定的。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0478","type":"judge","stem":"教师道德评价是人们包括教师自己依据一定的社会或阶级关于教师道德的标准，对教师的教育行为做出的善恶褒贬的判断。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0479","type":"judge","stem":"道德义务与政治义务、法律义务、职业义务等其他义务一样，需要靠外在的强制力量推动。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0480","type":"judge","stem":"从教师个体职业良心形成的角度看，教师的职业良心首先会受到社会生活和群体的影响。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0481","type":"judge","stem":"教师职业道德要求的内化是教育劳动的客观要求，决定着教师个人的素质，决定着教育所培养的人才的质量。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0482","type":"judge","stem":"所谓教师职业良心，就是教师在对学生、学生家长、同事以及对社会、学校、职业履行义务的过程中所形成的特殊道德责任感和道德自我评价能力。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0483","type":"judge","stem":"法律是成文的道德，道德是内心的法律，要发挥法治对道德建设的保障和促进作用，把道德导向贯穿法治建设全过程。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0484","type":"judge","stem":"以爱国主义为核心的民族精神和以团结奋斗为核心的时代精神，是中华民族生生不息、发展壮大的坚实精神支撑和强大道德力量。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0485","type":"judge","stem":"加强公民道德建设是一项长期而紧迫、艰巨而复杂的任务，要适应新时代新要求，推动全民道德素质和社会文明程度达到一个新高度。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0486","type":"judge","stem":"培养什么人、怎样培养人、为谁培养人是教育的根本问题。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0487","type":"judge","stem":"立德树人成效是检验高校一切工作的根本标准。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0488","type":"judge","stem":"落实立德树人根本任务，必须将价值塑造、知识传授和性格培养三者融为一体、不可割裂。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0489","type":"judge","stem":"全面加强教师队伍建设，要严师德、促发展、优管理、立尊严，提高教师社会地位，大力营造尊师重教的社会氛围。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0490","type":"judge","stem":"言教重于身教，引导教师开展社会实践，深入了解世情、党情、国情、社情、民情，强化教育强国、教育为民的责任担当。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0491","type":"judge","stem":"推进师德师风建设任务落到实处，各地各校要把加强师德师风建设、弘扬尊师重教传统作为教师队伍建设的首要任务。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0492","type":"judge","stem":"学校和相关部门依法保障教师履行教育职责，对无过错但客观上发生学生意外伤害的，教师依法不承担责任。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0493","type":"judge","stem":"大力提升教师职业道德素养，充分发挥课堂主渠道作用，在教育教学中提升师德素养，将立德树人放在首要位置。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0494","type":"judge","stem":"加强对新入职教师、青年教师的指导，通过老带新等机制，发挥传帮带作用，使其尽快熟悉教育规律、掌握教育方法，在育人实践中锤炼高尚道德情操。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0495","type":"judge","stem":"在教师的招聘引进、考核评价、日常监督与违规惩处等方面，强化师德师风要求，突出师德师风第一标准。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0496","type":"judge","stem":"教育必须为社会主义现代化建设服务、为人民服务，必须与生产劳动和社会实践相结合，培养德智体美劳全面发展的社会主义建设者和接班人。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0497","type":"judge","stem":"学校体育是实现立德树人根本任务、提升学生综合素质的基础性工程，是加快推进教育现代化、建设教育强国和体育强国的重要工作。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0498","type":"judge","stem":"2020年，中共中央、国务院印发《深化新时代教育评价改革总体方案》，改进高等学校评价，推进高校分类评价，引导不同类型高校科学定位，办出特色和水平。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0499","type":"judge","stem":"劳动教育是中国特色社会主义教育制度的重要内容，直接决定社会主义建设者和接班人的劳动精神面貌、劳动价值取向和劳动技能水平。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0500","type":"judge","stem":"教育督导是教育法规定的一项基本教育制度，在督促落实教育法律法规和教育方针政策、规范办学行为、提高教育质量等方面发挥了重要作用。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0501","type":"judge","stem":"将“四史”学习作为广大教师思想政治“必修课”，结合建党百年系列庆祝活动，以党史学习教育为主线，强化“四史”学习教育。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0502","type":"judge","stem":"习近平总书记关于教育的重要论述是习近平新时代中国特色社会主义思想的重要组成部分，是马克思主义基本原理同中国教育实践相结合的最新成果。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0503","type":"judge","stem":"2021年4月19日，习近平总书记考察清华大学并发表重要讲话，为我国高等教育发展和一流大学建设指明前进方向，对广大教师和青年学生提出殷切期望。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0504","type":"judge","stem":"2021年4月19日，习近平总书记考察清华大学并发表重要讲话，强调教师要成为大先生，做学生为学、为事、为人的示范，促进学生成长为全面发展的人。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0505","type":"judge","stem":"职业教育与普通教育是两种不同教育类型，具有同等重要地位。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0506","type":"judge","stem":"党史学习教育的明确要求，总的来说就是要做到学史明理、学史增信、学史崇德、学史力行，教育引导全党同志学党史、悟思想、办实事、开新局。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0507","type":"judge","stem":"将学生心理健康教育贯穿德育思政工作全过程，融入教育教学、管理服务和学生成长各环节，纳入“三全育人”大格局，坚定理想信念，厚植爱国情怀，引导学生扣好人生第一粒扣子，树立正确的世界观、人生观、价值观。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0508","type":"judge","stem":"高质量教师是高质量教育发展的中坚力量。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0509","type":"judge","stem":"建设社会主义现代化强国，对教师队伍建设提出了新的更高要求。要结合深入开展学习贯彻习近平新时代中国特色社会主义思想主题教育，把师德师风建设摆在更重要位置，切实增强广大教师为党育人、为国育才的责任感、使命感和紧迫感。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0510","type":"judge","stem":"教育部关于推开教职员工准入查询工作的通知规定，高等学校拟聘用教职员工的查询主体为教职员工所在的高等学校，由高等学校在全国教师管理信息系统的教职员工准入查询模块中进行查询。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0511","type":"judge","stem":"社会经济关系的变化的变化决定道德的变化。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0512","type":"judge","stem":"道德是靠社会舆论、传统习惯和内心信念来维持的。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0513","type":"judge","stem":"社会主义职业道德的基础和核心是爱岗敬业。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0514","type":"judge","stem":"在现代社会，国力的竞争，归根到底是教育的竞争、人才的竞争。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0515","type":"judge","stem":"教师职业技能集中地表现为教师教书育人的本领。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0516","type":"judge","stem":"教师的劳动对象是具有一定自觉意识的、有感情、有理智、个性特点各异的一代青少年，说明教师劳动对象具有复杂性。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0517","type":"judge","stem":"教师典范性的教育力量对学生的发展有启发作用、引导作用和激励作用。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0518","type":"judge","stem":"教师职业良心是制定教师职业道德规范、贯彻教师职业道德要求的指导和依据。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0519","type":"judge","stem":"高校教师主要从事教书育人工作，可以不去参加社会实践，承担社会义务。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0520","type":"judge","stem":"教师要关心、爱护全体学生，尊重学生人格，促进学生在品德、智力、体质等方面的全面发展。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0521","type":"judge","stem":"认为把教书和育人可以截然分开、对立起来，这种观点属于“分家论”。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0522","type":"judge","stem":"要使大学生沿着正确、健康的人生道路成长，就必须在教给他们科学文化知识和技能的同时进行思想品德教育。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0523","type":"judge","stem":"使学生得到全面发展是教育方针的核心和教育的目的，也是高等教育的必然要求。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0524","type":"judge","stem":"教师的劳动业绩、人生价值融合在学生成就中。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0525","type":"judge","stem":"教育是社会上一项不可缺少的重要职业，作为从事这项职业的教师，其职业道德的基本要求是爱岗敬业、依法执教。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0526","type":"judge","stem":"师生关系区别于其他人际关系的根本特点是由国家发展目标决定的。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0527","type":"judge","stem":"教师只有严谨治学、博学多才，才能适应学生日益增长的对学习的要求和对教师的要求。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0528","type":"judge","stem":"高校教师要真心关爱学生，严格要求学生，公平对待学生。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0529","type":"judge","stem":"高校教师应该尊重他人劳动和学术成果，维护学术自由和学术尊严。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0530","type":"judge","stem":"敬业爱生是高校教师的基本职责，是高校教师职业道德的基本内涵。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0531","type":"judge","stem":"从广义上讲，教师职业道德范畴是指反映和概括有关教师道德现象的各种基本概念。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0532","type":"judge","stem":"在教师做出某种职业行为之前，职业良心具有选择作用。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0533","type":"judge","stem":"当集体利益和个人利益发生冲突时，教师要仔细衡量孰轻孰重。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0534","type":"judge","stem":"教师职业的根本任务就是培养精英。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0535","type":"judge","stem":"教育活动自觉性的标志是教师对职业道德及其重要性的了解","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0536","type":"judge","stem":"在教师职业道德培养中，投身教育实践是完成教师职业道德修养的根本途径。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0537","type":"judge","stem":"衡量一个教师道德品质优劣的客观标准是教师的道德行为。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0538","type":"judge","stem":"教师道德信念深化了道德品质，使道德品质呈现出了稳定性的特点。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0539","type":"judge","stem":"教师道德行为选择是学生主体意志的体现。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0540","type":"judge","stem":"教师道德内化的程度与教龄的长短成正比。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0541","type":"judge","stem":"衡量一个教师品质优劣、道德水平高低的客观标志是教师道德情感。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0542","type":"judge","stem":"高等学校按照国家有关规定，自主开展与境外高等学校之间的科学技术文化交流与合作。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0543","type":"judge","stem":"高等学校的学生应当按照市场行情缴纳学费。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0544","type":"judge","stem":"部属师范大学要根据基础教育发展和课程改革的要求，加强公费师范生师德教育，引导公费师范生树立先进的教育理念，热爱教育事业，坚定长期从教的职业理想，为将来成为优秀教师和教育专家打下牢固根基。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0545","type":"judge","stem":"开展党史学习教育，用党的历史教育人、启迪人、感化人、鼓舞人，是牢记党的初心使命、坚定理想信念、推进自我革命的重要途径，是新时代坚持和发展中国特色社会主义、以中国式现代化全面推进中华民族伟大复兴的必然要求。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0546","type":"judge","stem":"党史学习教育工作的主要任务是：学史明理、学习增信、学史崇德、学史力行。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0547","type":"judge","stem":"用好学校思想政治理论课渠道，推进大中小学思想政治教育一体化建设，推动党史进教材、进课堂、进头脑，发挥党史立德树人的重要作用。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0548","type":"judge","stem":"要坚持党对新时代青年科技人才工作的全面领导，用党的初心使命感召青年科技人才，激励引导青年科技人才大力弘扬科学家精神。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0549","type":"judge","stem":"学校应当将提高学生网络素养等内容纳入教育教学活动，并合理使用网络开展教学活动，建立健全学生在校期间上网的管理制度，帮助学生养成良好上网习惯，培养学生网络安全和网络法治意识，增强学生对网络信息的获取和分析判断能力。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0550","type":"judge","stem":"学术学位与专业学位研究生教育都是国家培养高层次创新型人才的重要途径，都应把研究生的坚实基础理论、系统专门知识、创新精神和创新能力作为重点。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0551","type":"judge","stem":"专业学位类别设置主要依据行业产业人才需求，突出精准，应相对稳定。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0552","type":"judge","stem":"优化人才选拔标准，专业学位重点考核考生对学科知识的掌握与运用情况以及考生的学术创新潜力。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0553","type":"judge","stem":"专业学位重点考核考生的综合实践素质、运用专业知识分析解决实际问题能力以及职业发展潜力。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0554","type":"judge","stem":"完善研究生学业预警和分流退出机制，根据学生培养实际定期进行学业预警，对不适合继续攻读所在学科专业的研究生及时分流退出，保证研究生培养质量。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0555","type":"judge","stem":"强化导师分类管理，完善导师分类评聘与考核制度，符合条件的教师也不可以同时担任学术学位导师和专业学位导师。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0556","type":"judge","stem":"根据高等教育普及化阶段多样化人才需求，完善教材分类建设、分类使用、分类评价机制，克服教材结构与内容同质化倾向，实现本科教材特色和高质量发展。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0557","type":"judge","stem":"对于未按要求及时修订、主要编写者被发现存在师德师风和学术不端等问题，出现重大负面影响事件、教材出版或印制发行违规的教材，将责令退出“十四五”规划教材目录，不得继续使用规划教材专用标志，并按有关规定严肃追责问责。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0558","type":"judge","stem":"各地要支持龙头企业和高水平高等学校、职业学校牵头，联合行业组织、学校、科研机构、上下游企业等共同参与，组建一批产教深度融合、服务高效对接、支撑行业发展的跨区域行业产教融合共同体。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0559","type":"judge","stem":"广义的师德范畴就是指可以纳入教师道德规范体系并需要专门研究的基本概念。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0560","type":"judge","stem":"教师劳动关系的丰富性和这一关系调整所具有的自由度，决定着必须有教师的职业道德存在。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0561","type":"judge","stem":"由于教师劳动的个人性质和自由性，在某种意义上，教师的劳动表现为“良心活”的特点。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0562","type":"judge","stem":"一个教师不热爱自己的工作对象，就不会是真正热爱自己所从事的教书育人工作。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0563","type":"judge","stem":"振兴民族的希望在教育，振兴教育的希望在教师，提高教师素养的希望在师德的养成。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0564","type":"judge","stem":"教师的幸福具有效果上的无限性，表现在时间和空间两个维度。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0565","type":"judge","stem":"教师公正，教育必然公正，所以二者是一回事。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0566","type":"judge","stem":"制止有害于学生的行为或者其他侵犯学生合法权益的行为，批评和抵制有害于学生健康成长的现象。这是教师应当履行的义务。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0567","type":"judge","stem":"在教育工作中教师履行自己的道德义务就失去了职业自由。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0568","type":"judge","stem":"一个教师不热爱自己的工作对象同样可以说热爱自己所从事的教书育人工作，就像一个不喜欢自己的工作的工人同样可以生产出高质量的产品一样。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0569","type":"judge","stem":"现代学校教育是一项系统工程，教师的劳动是社会劳动的一部分，是在人们的相互联系中进行的。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0570","type":"judge","stem":"教师在教学过程中要养成人性化的教学风格和独特的教学艺术。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0571","type":"judge","stem":"教师热爱学生，一定要做到对学生公平公正，不分优劣，不分好坏，不分美丑，一视同仁。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]},{"id":"zyd_0572","type":"judge","stem":"教育对社会发展的作用，是通过促进生产力发展来实现。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["错误"]},{"id":"zyd_0573","type":"judge","stem":"教师可以在\"教书\"实践中贯彻落实教育法律法规和其它相关的方针和政策。","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":["正确"]}]}}};
(function(){
  "use strict";
  var DATA = window.QUIZ_DATA;
  var META = DATA.meta;
  var SUBJECTS = DATA.subjects;
  var SUBJECT_KEYS = Object.keys(SUBJECTS);

  var WRONG_PREFIX = 'wrong_', PROGRESS_PREFIX = 'progress_';
  function lsGet(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
  function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

  // ---- wrong book ----
  function getWrong(k){ return lsGet(WRONG_PREFIX+k, {}); }
  function addWrong(k,id,ans){
    var o=getWrong(k);
    if(!o[id]) o[id]={times:0,lastAnswer:'',addedAt:Date.now()};
    o[id].times++; o[id].lastAnswer=ans||''; o[id].addedAt=Date.now();
    lsSet(WRONG_PREFIX+k,o);
  }
  function removeWrong(k,id){ var o=getWrong(k); if(o[id]){ delete o[id]; lsSet(WRONG_PREFIX+k,o); } }
  function wrongIds(k){ return Object.keys(getWrong(k)); }
  function wrongTotal(){ var t=0; SUBJECT_KEYS.forEach(function(k){ t+=wrongIds(k).length; }); return t; }

  // ---- progress ----
  function getProgress(k,m){ return lsGet(PROGRESS_PREFIX+k+'_'+m, null); }
  function saveProgress(k,m,d){ lsSet(PROGRESS_PREFIX+k+'_'+m, d); }
  function clearProgress(k,m){ lsDel(PROGRESS_PREFIX+k+'_'+m); }

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  var TYPE_LABEL = { single:'单选题', multiple:'多选题', judge:'判断题' };

  var state = {
    view:'home', subjectKey:'', mode:'practice', questions:[], index:0,
    q:null, selected:[], submitted:false, correct:false, correctKeys:[],
    correctCount:0, wrongCount:0, finished:false, result:null, resumed:false
  };

  var app = document.getElementById('app');

  // ---------- navigation ----------
  function startPractice(key){
    var mode='practice';
    var questions = SUBJECTS[key].questions.slice();
    var initialIndex=0, correctCount=0, wrongCount=0, resumed=false;
    var prog=getProgress(key,mode);
    if(prog && typeof prog.index==='number' && prog.index < questions.length){
      var idx=prog.index;
      if(prog.id){ for(var j=0;j<questions.length;j++){ if(questions[j].id===prog.id){ idx=j; break; } } }
      initialIndex=idx; correctCount=prog.correctCount||0; wrongCount=prog.wrongCount||0; resumed=true;
    }
    state.view='quiz'; state.subjectKey=key; state.mode=mode; state.questions=questions;
    state.correctCount=correctCount; state.wrongCount=wrongCount; state.resumed=resumed;
    loadQuestion(initialIndex,true);
  }
  function startWrong(key){
    var mode='wrong';
    var ids=wrongIds(key), set={}; ids.forEach(function(i){ set[i]=true; });
    var questions=SUBJECTS[key].questions.filter(function(q){ return set[q.id]; });
    if(questions.length===0){ alert('该科目暂无错题'); return; }
    state.view='quiz'; state.subjectKey=key; state.mode=mode; state.questions=questions;
    state.correctCount=0; state.wrongCount=0; state.resumed=false;
    loadQuestion(0,false);
  }
  function loadQuestion(i,isResume){
    var q=state.questions[i];
    state.index=i; state.q=q; state.selected=[]; state.submitted=false; state.correct=false;
    state.correctKeys=q.answer.slice().sort();
    state.resumed=!!isResume;
    saveProgress(state.subjectKey,state.mode,{
      index:i, id:q.id, correctCount:state.correctCount, wrongCount:state.wrongCount,
      total:state.questions.length, savedAt:Date.now()
    });
    render();
  }
  function onSelect(key){
    if(state.submitted) return;
    var q=state.q;
    if(q.type==='multiple'){
      var idx=state.selected.indexOf(key);
      if(idx>=0) state.selected.splice(idx,1); else state.selected.push(key);
    } else {
      state.selected=[key];
    }
    render();
  }
  function onSubmit(){
    if(state.submitted) return;
    if(state.selected.length===0){ alert('请先选择答案'); return; }
    var sel=state.selected.slice().sort();
    var ck=state.correctKeys;
    var ok = sel.length===ck.length;
    if(ok){ for(var i=0;i<sel.length;i++){ if(sel[i]!==ck[i]){ ok=false; break; } } }
    state.submitted=true; state.correct=ok;
    if(ok){
      state.correctCount++;
      if(state.mode==='wrong') removeWrong(state.subjectKey,state.q.id);
    } else {
      state.wrongCount++;
      addWrong(state.subjectKey,state.q.id,state.selected.join(','));
    }
    saveProgress(state.subjectKey,state.mode,{
      index:state.index, id:state.q.id, correctCount:state.correctCount,
      wrongCount:state.wrongCount, total:state.questions.length, savedAt:Date.now()
    });
    render();
  }
  function onNext(){
    var next=state.index+1;
    if(next>=state.questions.length) finish(); else loadQuestion(next,false);
  }
  function finish(){
    clearProgress(state.subjectKey,state.mode);
    var total=state.questions.length;
    var acc = total>0 ? Math.round(state.correctCount/total*100) : 0;
    state.finished=true;
    state.result={ total:total, correctCount:state.correctCount, wrongCount:state.wrongCount, accuracy:acc };
    state.view='result';
    render();
  }
  function onRestart(){
    clearProgress(state.subjectKey,state.mode);
    state.correctCount=0; state.wrongCount=0; state.resumed=false;
    loadQuestion(0,false);
  }
  function goHome(){ state.view='home'; state.finished=false; state.result=null; render(); }

  // ---------- rendering helpers ----------
  function cls(key){
    if(!state.submitted) return state.selected.indexOf(key)>=0 ? 'selected' : '';
    if(state.correctKeys.indexOf(key)>=0) return 'right';
    if(state.selected.indexOf(key)>=0) return 'wrong';
    return '';
  }
  function mark(key){
    if(!state.submitted) return '';
    if(state.correctKeys.indexOf(key)>=0) return '✓';
    if(state.selected.indexOf(key)>=0) return '✗';
    return '';
  }
  function renderOptions(){
    var q=state.q, html='';
    if(q.type==='judge'){
      q.options.forEach(function(o){
        html += '<div class="opt judge '+cls(o.key)+'" data-action="select" data-key="'+esc(o.key)+'">'+esc(o.text)+'</div>';
      });
    } else {
      q.options.forEach(function(o){
        html += '<div class="opt '+cls(o.key)+'" data-action="select" data-key="'+esc(o.key)+'">'
              + '<span class="opt-key">'+esc(o.key)+'</span>'
              + '<span class="opt-text">'+esc(o.text)+'</span>'
              + '<span class="opt-mark">'+mark(o.key)+'</span></div>';
      });
    }
    return html;
  }

  function renderHome(){
    var cards='';
    SUBJECT_KEYS.forEach(function(k){
      var s=SUBJECTS[k];
      var prog=getProgress(k,'practice');
      var wc=wrongIds(k).length;
      var cont = (prog && typeof prog.index==='number' && prog.index < s.questions.length)
                 ? ('继续 · 第 '+(prog.index+1)+' 题') : null;
      cards += '<div class="subj-card">'
        + '<div class="subj-head"><span class="subj-name">'+esc(s.name)+'</span>'
        + (wc?'<span class="badge">错 '+wc+'</span>':'')+'</div>'
        + '<div class="subj-meta">共 '+s.questions.length+' 题</div>'
        + '<div class="subj-actions">'
        + '<button class="btn primary" data-action="start" data-key="'+k+'">'+(cont?esc(cont):'开始练习')+'</button>'
        + (wc?'<button class="btn ghost" data-action="startWrong" data-key="'+k+'">练错题 ('+wc+')</button>':'')
        + '</div></div>';
    });
    app.innerHTML = '<div class="hero"><h1>教师招考刷题</h1>'
      + '<p>高等教育学 · 高等教育心理学 · 职业道德与法规</p></div>'
      + '<div class="subjects">'+cards+'</div>'
      + '<div class="wrong-card"><div class="wrong-head">📕 错题本（共 '+wrongTotal()+' 题）</div>'
      + '<button class="btn ghost full" data-action="wrong">查看 / 复习错题</button></div>'
      + '<p class="foot">进度自动保存在本机，关闭页面不丢失。</p>';
  }

  function renderQuiz(){
    var q=state.q;
    var pct = Math.round((state.index+1)/state.questions.length*100);
    var resumeNote = (state.resumed && !state.submitted)
      ? '<div class="resume-note">已从上次进度继续（第 '+(state.index+1)+' 题）</div>' : '';
    var isLast = state.index+1>=state.questions.length;
    app.innerHTML = '<div class="topbar">'
      + '<button class="back" data-action="home">‹ 首页</button>'
      + '<div class="prog">第 '+(state.index+1)+' / '+state.questions.length+' 题</div>'
      + '<div class="typetag">'+TYPE_LABEL[q.type]+'</div></div>'
      + '<div class="pbar"><div class="pbar-fill" style="width:'+pct+'%"></div></div>'
      + '<div class="stem">'+esc(q.stem)+'</div>'
      + '<div class="options'+(q.type==='judge'?' judge':'')+'">'+renderOptions()+'</div>'
      + (state.submitted?'<div class="tip '+(state.correct?'ok':'bad')+'">'
          +(state.correct?'回答正确 🎉':'回答错误')+'　正确答案：'+state.correctKeys.join('、')+'</div>':'')
      + '<div class="scorebar">对 <b class="ok">'+state.correctCount+'</b> · 错 <b class="bad">'+state.wrongCount+'</b></div>'
      + resumeNote
      + '<div class="actions">'
      + (state.submitted?'':'<button class="btn primary" data-action="submit">提交答案</button>')
      + (state.submitted?'<button class="btn primary" data-action="next">'+(isLast?'完成 ✓':'下一题 →')+'</button>':'')
      + '<button class="btn ghost" data-action="restart">↺ 重头做</button>'
      + '</div>';
  }

  function renderResult(){
    var r=state.result;
    var title = (state.mode==='wrong' && r.wrongCount===0) ? '🎉 错题已全部攻克' : '本次答题完成';
    app.innerHTML = '<div class="result"><div class="result-card">'
      + '<div class="result-title">'+title+'</div>'
      + '<div class="result-grid">'
      + '<div><b>'+r.total+'</b><span>总题数</span></div>'
      + '<div><b class="ok">'+r.correctCount+'</b><span>答对</span></div>'
      + '<div><b class="bad">'+r.wrongCount+'</b><span>答错</span></div>'
      + '<div><b>'+r.accuracy+'%</b><span>正确率</span></div>'
      + '</div>'
      + '<div class="actions col">'
      + '<button class="btn primary" data-action="restart">再来一轮</button>'
      + '<button class="btn ghost" data-action="home">返回首页</button>'
      + '</div></div></div>';
  }

  function renderWrong(){
    var html='<div class="wrong-view"><div class="topbar">'
      + '<button class="back" data-action="home">‹ 首页</button>'
      + '<div class="ttl">错题本</div></div>';
    SUBJECT_KEYS.forEach(function(k){
      var s=SUBJECTS[k];
      var ids=wrongIds(k);
      var list='';
      ids.forEach(function(id){
        var q=null;
        for(var i=0;i<s.questions.length;i++){ if(s.questions[i].id===id){ q=s.questions[i]; break; } }
        if(!q) return;
        var w=getWrong(k)[id]||{lastAnswer:'—',times:0};
        list += '<li class="witem"><div class="wstem">'+esc(q.stem)+'</div>'
          + '<div class="wans">正确答案：<b>'+q.answer.join('、')+'</b></div>'
          + '<div class="wmeta">你的作答：'+esc(w.lastAnswer)+' · 错 '+(w.times||0)+' 次</div></li>';
      });
      html += '<div class="wsubj"><div class="wsubj-head"><span>'+esc(s.name)+'</span>'
        + '<span class="cnt">'+ids.length+' 题</span></div>';
      if(ids.length){
        html += '<div class="wactions"><button class="btn ghost sm" data-action="startWrong" data-key="'+k+'">练这组错题</button>'
          + '<button class="btn ghost sm" data-action="clearSubject" data-key="'+k+'">清空</button></div>'
          + '<ul class="wlist">'+list+'</ul>';
      } else {
        html += '<div class="empty">暂无错题</div>';
      }
      html += '</div>';
    });
    if(wrongTotal()){
      html += '<div class="danger-wrap"><button class="btn danger full" data-action="clearAll">清空全部错题</button></div>';
    }
    html += '</div>';
    app.innerHTML = html;
  }

  function render(){
    if(state.view==='home') renderHome();
    else if(state.view==='quiz') renderQuiz();
    else if(state.view==='result') renderResult();
    else if(state.view==='wrong') renderWrong();
    window.scrollTo(0,0);
  }

  // ---------- event delegation ----------
  app.addEventListener('click', function(e){
    var t=e.target.closest('[data-action]');
    if(!t) return;
    var a=t.getAttribute('data-action');
    var key=t.getAttribute('data-key');
    if(a==='start') startPractice(key);
    else if(a==='startWrong') startWrong(key);
    else if(a==='select') onSelect(t.getAttribute('data-key'));
    else if(a==='submit') onSubmit();
    else if(a==='next') onNext();
    else if(a==='restart') onRestart();
    else if(a==='home') goHome();
    else if(a==='wrong'){ state.view='wrong'; render(); }
    else if(a==='clearSubject'){ if(confirm('清空该科目错题记录？')){ lsDel(WRONG_PREFIX+key); render(); } }
    else if(a==='clearAll'){ if(confirm('清空全部错题记录？')){ SUBJECT_KEYS.forEach(function(k){ lsDel(WRONG_PREFIX+k); }); render(); } }
  });

  render();
})();
</script>
</body>
</html>
